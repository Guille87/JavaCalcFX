version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      testing:
        patterns:
          - "org.junit*"
          - "org.testfx*"
    ignore:
      # JavaFX: quedarse en la 21 LTS (parches sí, saltos de major no: 22+ no
      # tienen build de Monocle y la CI tendría que pasar a xvfb).
      - dependency-name: "org.openjfx:*"
        update-types: ["version-update:semver-major"]
      # Monocle se queda en la 17.x: la 21.x exige un runtime 21+ y la CI
      # también prueba en JDK 17 (ver el comentario en el pom).
      - dependency-name: "org.testfx:openjfx-monocle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
