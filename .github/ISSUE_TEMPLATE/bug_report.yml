name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. You can write in English or Spanish.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in Settings → About (e.g. 0.3.0), or the installer / zip file name.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - .msi installer
        - portable .zip
        - from source (mvn javafx:run)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the "..." calculator
        2. Enter "..."
        3. Press Calculate
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message or a screenshot if there is one.
    validations:
      required: true
